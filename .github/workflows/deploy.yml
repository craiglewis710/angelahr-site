name: deploy

on:
  push:
    branches: [main, dev]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - uses: actions/checkout@v4
        with:
          ref: dev
          path: site/dev

      # keep the dev copy out of search indexes without touching the branch content
      - run: |
          rm -rf site/.git site/dev/.git
          sed -i 's|</head>|<meta name="robots" content="noindex"></head>|' site/dev/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
